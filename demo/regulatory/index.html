<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="From a sponsor protocol to a Nigeria-ready NAFDAC submission package, with every requirement traced to the public document it came from.">
<title>IBMT Clinical | Trial startup demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app; sticky header; bottom tab bar; every regulatory claim carries a source chip that opens a source sheet */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --fg:#14211f; --muted:#5b6b68; --line:#d9e2e0;
  --accent:#0f6b5c; --accent-soft:#e1f0ec; --accent-ink:#ffffff;
  --good:#1f7a3f; --good-soft:#e3f3e8; --warn:#9a6200; --warn-soft:#fbefd9; --crit:#b3261e; --crit-soft:#fbe4e2; --info:#2d5ea8; --info-soft:#e4ecf9;
  --font-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#16201e; --fg:#e6efed; --muted:#9db0ac; --line:#2a3836;
  --accent:#4cc2a8; --accent-soft:#163a33; --accent-ink:#06201b;
  --good:#6fd38f; --good-soft:#173322; --warn:#f0b54a; --warn-soft:#3a2a0d; --crit:#ff8a80; --crit-soft:#3d1916; --info:#8cb4f5; --info-soft:#17263f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#16201e; --fg:#e6efed; --muted:#9db0ac; --line:#2a3836;
  --accent:#4cc2a8; --accent-soft:#163a33; --accent-ink:#06201b;
  --good:#6fd38f; --good-soft:#173322; --warn:#f0b54a; --warn-soft:#3a2a0d; --crit:#ff8a80; --crit-soft:#3d1916; --info:#8cb4f5; --info-soft:#17263f;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 104px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:720px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.01em;font-size:16px}
.brand span{color:var(--accent)}
.hdr-btn{margin-left:auto;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 12px/1 var(--font-ui);padding:7px 10px;border-radius:999px;cursor:pointer}
.proto{font:500 11px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--warn);background:var(--warn-soft);padding:5px 8px;border-radius:999px}
.study-line{max-width:720px;margin:0 auto;padding:0 16px 10px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.study-line b{color:var(--fg);font-weight:600}
h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:22px 0 6px;text-wrap:balance}
h2{font-size:17px;margin:24px 0 8px;letter-spacing:-.01em;text-wrap:balance}
p.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:22px}
.banner{background:var(--warn-soft);border-radius:var(--r);padding:10px 12px;font-size:13px;margin:12px 0}
.banner b{color:var(--warn)}
.banner.info{background:var(--info-soft)} .banner.info b{color:var(--info)}
.btn{appearance:none;border:0;border-radius:10px;padding:13px 16px;font:600 15px/1.2 var(--font-ui);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn-row .btn{flex:1 1 200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat .n{font:700 22px/1.1 var(--font-ui);font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.chip-s,.ptag{font:500 11px/1 var(--font-mono);border:0;border-radius:6px;padding:4px 6px;cursor:pointer;white-space:nowrap;vertical-align:1px}
.ptag{background:var(--accent-soft);color:var(--accent)}
.chip-s{background:var(--info-soft);color:var(--info)}
/* facts */
.fact{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact .k{font-size:12.5px;color:var(--muted)}
.fact .v{font-weight:600;min-width:0}
.fact .meta{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.conf{font:500 10.5px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;border-radius:5px}
.conf.high{background:var(--good-soft);color:var(--good)} .conf.med{background:var(--warn-soft);color:var(--warn)} .conf.low{background:var(--crit-soft);color:var(--crit)}
.gap{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.gap:last-child{border-bottom:0}
.gap i{width:22px;height:22px;border-radius:50%;background:var(--crit-soft);color:var(--crit);display:grid;place-items:center;font:700 12px/1 var(--font-mono);font-style:normal}
/* checklist */
.req{display:grid;grid-template-columns:28px 1fr;gap:10px}
.step{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12.5px/1 var(--font-mono)}
.req h3{margin:2px 0;font-size:15px;line-height:1.3}
.why{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.why b{color:var(--fg);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;font:500 10.5px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:5px}
.b-src{background:var(--good-soft);color:var(--good)} .b-unv{background:var(--warn-soft);color:var(--warn)} .b-likely{background:var(--info-soft);color:var(--info)}
.group{font:600 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
.na{font-size:13.5px;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r)}
/* package */
.pk{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.pk:last-child{border-bottom:0}
.pk .no{font:500 11.5px/1.6 var(--font-mono);color:var(--muted)}
.pk .t{font-size:14px;font-weight:600;line-height:1.35}
.pk .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{font:600 11px/1 var(--font-ui);padding:6px 8px;border-radius:999px;white-space:nowrap}
.p-ready{background:var(--good-soft);color:var(--good)} .p-fix{background:var(--warn-soft);color:var(--warn)} .p-need{background:var(--info-soft);color:var(--info)} .p-gap{background:var(--crit-soft);color:var(--crit)} .p-wait{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:8px 0 14px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font:500 13px/1 var(--font-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;font-size:14.5px;line-height:1.65}
.doc p{margin:0 0 12px;max-width:65ch}
.doc .ptag,.doc .chip-s{margin-left:4px}
.ph{background:var(--crit-soft);color:var(--crit);border-radius:4px;padding:1px 4px;font-weight:600}
.review{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:0 0 auto}
/* reading */
.reading{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.rline{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.rline.done{color:var(--fg)}
.tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;font-size:11px}
.rline.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px 16px;color:var(--muted);background:var(--surface)}
.drop b{color:var(--fg);display:block;font-size:15px;margin-bottom:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:720px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:16px}
.sheet .meta{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.src{padding:12px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.src .id{font:600 11.5px/1 var(--font-mono);color:var(--info)}
.src a{color:var(--accent);word-break:break-word}
/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:600 11px/1.1 var(--font-ui);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-height:56px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab:disabled{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px)}
.foot{font-size:12px;color:var(--muted);margin-top:28px}
/* regulatory authorities */
.auths{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.auth{flex:1 1 150px;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:2px;
  align-items:flex-start}
.auth b{font-size:14px;line-height:1.25}
.auth span{font-size:12px;color:var(--muted);line-height:1.3}
.auth .chip-s{margin-top:5px}
/* protocol picker */
.protocard{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--fg)}
.protocard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-top b{font-size:15px}
.pc-d{font-size:13px;color:var(--muted);margin-top:4px}
/* dose check */
.dosecheck{padding:0}
.dc-head{display:flex;gap:10px;align-items:flex-start;padding:14px}
.dc-mark{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font:700 14px/1 var(--font-mono)}
.dosecheck.no .dc-mark{background:var(--good-soft);color:var(--good)}
.dosecheck.yes .dc-mark{background:var(--warn-soft);color:var(--warn)}
.dosecheck.no{border-color:var(--good)} .dosecheck.yes{border-color:var(--warn)}
.dc-head h3{margin:0;font-size:15.5px;line-height:1.3}
.dc-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.dc-list{margin:0;padding:0 14px 14px 32px;font-size:13.5px;line-height:1.6}
.dc-list li{margin-bottom:8px} .dc-list li:last-child{margin-bottom:0}
.link{appearance:none;border:0;background:none;color:var(--accent);font:600 13px/1 var(--font-ui);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* print: only the draft itself, with a header identifying it */
.printhead{display:none}
@media print{
  body{background:#fff;color:#000}
  body *{visibility:hidden}
  .doc,.doc *,.printhead,.printhead *{visibility:visible}
  header.top,nav.tabs,.toast,.scrim{display:none!important}
  .wrap{padding:0;max-width:none}
  .printhead{display:block;margin:0 0 14px;border-bottom:1px solid #000;padding-bottom:8px}
  .printhead b{display:block;font-size:16px}
  .printhead span{display:block;font-size:12px;color:#444;margin-top:2px}
  .doc{position:absolute;left:0;top:0;width:100%;border:0;border-radius:0;padding:0;
    background:#fff;color:#000;font-size:11pt;line-height:1.5}
  .doc .ptag,.doc .chip-s{border:1px solid #666;background:#fff;color:#000;padding:1px 4px}
  .ph{background:#fff;color:#000;border:1px dashed #000;font-weight:400}
  a{color:#000}
}
</style>

<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">IBMT <span>Clinical</span></div>
    <span class="proto">Prototype</span>
    <button class="hdr-btn" id="openSources">Sources</button>
  </div>
  <div class="study-line" id="studyLine" hidden><b>ARETTA</b><span>· NCT03879577 · Public protocol, Jan 2019</span></div>
</header>

<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-inner">
    <button class="tab" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-go="facts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>Protocol</button>
    <button class="tab" data-go="checklist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Checklist</button>
    <button class="tab" data-go="package"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg>Package</button>
  </div>

<script>
/* ---------- Sources (public documents reviewed) ---------- */
const SRC = {
 S1:{t:"NAFDAC Guidelines for Clinical Trial Application in Nigeria", ref:"DER-GDL-002-01 · effective 2 Jan 2019 · confirmed still current, with the 17-document package unchanged, by IBMT Clinical's regulatory lead, November 2026", url:"https://www.policyvault.africa/wp-content/uploads/policy/NGA336.pdf", kind:"Official guideline"},
 S2:{t:"NAFDAC Guidelines for Submission of Clinical Trial Progress Report", ref:"DER-GDL-010-00 · effective 2 Jan 2019", url:"https://policyvault.africa/wp-content/uploads/policy/NGA338.pdf", kind:"Official guideline"},
 S3:{t:"NAFDAC Guidelines for Conduct of Clinical Trials during Emergencies", ref:"DER-GDL-015-00 · effective 8 May 2019", url:"https://www.policyvault.africa/wp-content/uploads/policy/NGA340.pdf", kind:"Official guideline"},
 S4:{t:"National Code for Health Research Ethics (2006), as presented by NHREC", ref:"Prof. Adejumo, \"The human research participant protection system in Nigeria,\" 26 Mar 2021", url:"https://www.kcl.ac.uk/kghp/assets/the-human-research-participant-protection-system-in-nigeria-prof-adejumo.pdf", kind:"Summary of national code (read the code itself to confirm)"},
 S5:{t:"LUTH Health Research Ethics Committee", ref:"Lagos University Teaching Hospital website", url:"https://luth.gov.ng/research/hrec", kind:"Ethics committee website"},
 S6:{t:"Nigeria Clinical Trials Registry: FAQ", ref:"nctr.nhrec.net", url:"https://nctr.nhrec.net/FAQ.php", kind:"Registry website"},
 S7:{t:"NAFDAC authorization letter, CRASH-19 trial", ref:"NAFDAC/DER/SW/CT&D/2020/CRASH-19 · 29 Jun 2020 · public example of an approval", url:"https://crash19.lshtm.ac.uk/wp-content/uploads/2020/07/NAFDAC-CRASH-19-APPROVAL.pdf", kind:"Real approval letter (public)"},
 S8:{t:"ARETTA protocol (NCT03879577)", ref:"University of Chicago Center for Global Health · released 30 Jan 2019 · pages 1–51 reviewed", url:"https://cdn.clinicaltrials.gov/large-docs/77/NCT03879577/Prot_SAP_000.pdf", kind:"Public protocol on ClinicalTrials.gov"},
 S9:{t:"NAFDAC Good Clinical Practice Guidelines (2025)", ref:"Reported effective 5 May 2025, aligned with ICH E6(R3). Not yet reviewed by IBMT Clinical.", url:"https://casrai.org/guides/nafdac-nigeria-clinical-trial-approval-pathway", kind:"Third-party report (to obtain the guideline itself)"},
 S10:{t:"CYP3A5-guided tacrolimus dosing protocol (NCT04825262)", ref:"Singapore General Hospital · Protocol 2019/2599 v1.3 · 29 Sep 2021", url:"https://cdn.clinicaltrials.gov/large-docs/62/NCT04825262/Prot_000.pdf", kind:"Public protocol on ClinicalTrials.gov"},
 S11:{t:"Docetaxel clearance did not differ by ethnicity (CALGB 9871)", ref:"Cited in a 64-patient secondary analysis: 20 African American, 44 Caucasian; cohort pooled because the parent study found no clearance difference", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3647228", kind:"Negative finding — argues against dose adaptation"},
 S12:{t:"CYP3A5 and ABCB1 genotype vs docetaxel pharmacokinetics", ref:"34 patients: \"Docetaxel CL was not related to midazolam CL or genotype\"; no effect on toxicity or response", url:"https://link.springer.com/article/10.1007/s00280-011-1609-9", kind:"Negative finding — argues against dose adaptation"},
 S13:{t:"CPIC Guideline for CYP3A5 Genotype and Tacrolimus Dosing", ref:"Expressers: increase starting dose 1.5–2×, cap 0.3 mg/kg/day, with therapeutic drug monitoring", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC4481158", kind:"Official guideline"},
 S14:{t:"Tacrolimus dose-normalised trough by CYP3A5 genotype", ref:"Day 3, n=164 · expressers 54.61 ng/mL per mg/kg/day (IQR 31.98–78.87), non-expressers 91.80 (IQR 57.60–130.20)", url:"https://link.springer.com/article/10.1007/s00228-015-1990-0", kind:"Published pharmacokinetic cohort"},
 S15:{t:"CYP3A5 diversity across African populations", ref:"CYP3A5*3 frequency 0.13 in Igbo (Nigeria), 0.04 Uganda to 0.80 Morocco; ~98% of European haplotypes carry *3", url:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3655848/", kind:"Population genetics"},
 S16:{t:"IBMT Clinical Pharmacogenomic Dose Simulator", ref:"Calibrated on S14; validated against CPIC dosing (S13), which was not used in fitting", url:"../simulator/", kind:"IBMT Clinical model"},
 S17:{t:"National Health Research Ethics Committee (NHREC)", ref:"Federal Ministry of Health, Abuja · approves and monitors health research, and issues the national ethical guidelines", url:"https://nhrec.gov.ng/", kind:"Official regulator website"}
};

/* ---------- Pharmacogenomic model (ported from the IBMT simulator) ---------- */
const TAC = {
  CD:{EXP:54.61, NON:91.80},            // ng/mL per mg/kg/day, day-3 trough  [S14]
  SIG:{EXP:0.6692, NON:0.6046},         // lognormal, derived from published IQRs
  lo:10, hi:15, safeLo:4, safeHi:20,    // protocol's own target and stopping bounds [S10]
  q3:{ng:0.13, sg:0.30}                 // CYP3A5*3: Nigeria (Igbo) [S15]; Singapore back-solved
};
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)
  *t*Math.exp(-x*x));}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const tacCdf=(x,dose,mix)=>{let s=0;for(const g in mix)
  s+=mix[g]*Phi((Math.log(x)-Math.log(dose*TAC.CD[g]))/TAC.SIG[g]);return s;};
const expMix=q3=>({EXP:1-q3*q3, NON:q3*q3});
function tacStats(dose,mix){
  const b=tacCdf(TAC.lo,dose,mix), u=tacCdf(TAC.hi,dose,mix);
  return {below:b*100, inTarget:(u-b)*100, above:(1-u)*100,
          outside:(tacCdf(TAC.safeLo,dose,mix)+1-tacCdf(TAC.safeHi,dose,mix))*100};
}
/* Two optima: the dose that maximises target attainment, and the best dose that also
   respects the protocol's own stopping rule. Where they differ, the rule is binding. */
function tacBestDose(mix,capOutside){let best=0,bw=-1;
  /* search on the same 0.01 grid the dose is reported at, so the quoted figures
     always describe the quoted dose */
  for(let i=5;i<=40;i++){const d=i/100;
    if(capOutside!==undefined && tacStats(d,mix).outside > capOutside) continue;
    const w=tacCdf(TAC.hi,d,mix)-tacCdf(TAC.lo,d,mix);
    if(w>bw){bw=w;best=d;}}
  return best;}
/* CPIC recommends 1.5–2x the standard starting dose for CYP3A5 expressers. */
const cpicFit = r => r < 1.5 ? "below" : r > 2 ? "above" : "inside";

function doseCheckAretta(){
 return {indicated:false,
  head:"No pharmacogenomic dose adaptation indicated",
  sub:"Docetaxel and trastuzumab, checked against CYP3A4/5 and ancestry evidence",
  lines:[
   {t:"Docetaxel is metabolised mainly by CYP3A4. A 34-patient study testing CYP3A5 and ABCB1 directly found docetaxel clearance was not related to genotype, and found no effect on toxicity or response.", src:["S12",""]},
   {t:"CALGB 9871 found no difference in docetaxel clearance by ethnicity. A later 64-patient analysis (20 African American, 44 Caucasian) pooled its cohort on that basis.", src:["S11",""]},
   {t:"Trastuzumab is a monoclonal antibody. It is not cytochrome-metabolised, so no pharmacogenomic dosing basis applies."},
   {t:"Conclusion: the protocol's dosing carries over to Nigerian sites unchanged. No dose-rationale section is required for this submission, and none has been drafted.", b:true}
  ]};
}
function doseCheckTacro(){
 const proto = tacStats(0.15, NG_MIX), protoSG = tacStats(0.15, SG_MIX);
 const free = tacBestDose(NG_MIX),          freeS = tacStats(free, NG_MIX);
 const safe = tacBestDose(NG_MIX, 25),      safeS = tacStats(safe, NG_MIX);
 const binds = Math.abs(free - safe) > 1e-9;     // does the stopping rule constrain the dose?
 const expPct = (1 - TAC.q3.ng*TAC.q3.ng)*100;
 const lines = [
  {t:`The protocol assumes about 51% CYP3A5 expressers. Using an Igbo CYP3A5*3 frequency of 0.13, the Nigerian figure is about ${n0(expPct)}%.`, src:["S15",""]},
  {t:`At the protocol's 0.15 mg/kg/day non-expresser dose, the model predicts ${n0(proto.below)}% of Nigerian patients below the 10 ng/mL target, against ${n0(protoSG.below)}% for the protocol's own population mix. Under-exposure after transplant carries rejection risk.`, src:["S16",""]},
  {t:`Raising the dose helps but does not resolve it. Target attainment peaks at only ${n0(freeS.inTarget)}% at ${free.toFixed(2)} mg/kg/day, because tacrolimus variability is wide (published CV 66–75%) against a narrow 10–15 ng/mL window. This is why the parent protocol relies on therapeutic drug monitoring from day 3.`, src:["S14",""]}
 ];
 const ratio = safe/0.15, fit = cpicFit(ratio);
 if(binds) lines.push(
  {t:`The protocol's own stopping rule binds before that point. It halts the study if more than 25% of patients record a day-3 trough outside 4–20 ng/mL; at ${free.toFixed(2)} mg/kg/day the model predicts ${n1(freeS.outside)}%, which would breach it.`, src:["S10",""]},
  {t:`Highest dose that respects the stopping rule: ${safe.toFixed(2)} mg/kg/day — ${n1(safeS.outside)}% outside bounds, ${n0(safeS.inTarget)}% in target, ${n0(safeS.below)}% below it.`, src:["S16",""]});
 else lines.push(
  {t:`Recommended starting dose ${safe.toFixed(2)} mg/kg/day, within the stopping rule at ${n1(safeS.outside)}% outside bounds.`, src:["S16",""]});
 lines.push(fit === "inside"
  ? {t:`That is ${ratio.toFixed(1)}× the non-expresser dose, inside CPIC's 1.5–2× recommendation for expressers and under its 0.3 mg/kg/day cap.`, src:["S13",""]}
  : {t:`That is only ${ratio.toFixed(1)}× the non-expresser dose, which falls ${fit} CPIC's 1.5–2× recommendation for CYP3A5 expressers. In a cohort that is ${n0(expPct)}% expressers, this protocol's stopping rule prevents the starting dose that guidance calls for.`, src:["S13",""]});
 lines.push({t: binds
   ? `Conclusion: a starting-dose change alone is not sufficient. The stopping rule constrains the dose below ${fit === "inside" ? "the optimum" : "what CPIC recommends"}, so the sponsor should be asked to re-examine the rule and the monitoring schedule for a Nigerian cohort, not only the dose. A dose-rationale section has been drafted on that basis.`
   : "A dose-rationale section has been drafted for the submission. See the Package tab.", b:true});
 return {indicated:true, free, freeS, safe, safeS, proto, protoSG, expPct, binds, lines,
  head:"Dose adaptation indicated",
  sub:"CYP3A5 expresser frequency differs sharply between the protocol's population and Nigeria"};
}

const app=document.getElementById("app");
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
function go(x){ if(x!=="home"&&!state.loaded) return; if(["checklist","package"].includes(x)&&!state.confirmed){x="facts";toast("Confirm the protocol facts first");} state.screen=x; save(); render(); window.scrollTo(0,0); }

/* ---------- Screens ---------- */
function home(){return `
 <div class="eyebrow">Africa Trial Startup · Nigeria</div>
 <h1>From protocol to a Nigeria-ready submission</h1>
 <p class="lead">We read your protocol, map it against NAFDAC and ethics committee requirements, check your submission package for gaps before you file, and run the filing and follow-up with a local team.</p>
 <div class="group">Choose a protocol</div>
 <div class="stack">${Object.values(PROTOCOLS).map(p=>`
  <button class="card protocard" data-proto="${p.id}" aria-pressed="${state.proto===p.id}">
   <div class="pc-top"><b>${p.name}</b><span class="badge ${state.proto===p.id?"b-src":"b-likely"}">${p.tag}</span></div>
   <div class="pc-d">${p.nct} · ${p.blurb}</div></button>`).join("")}</div>
 <p class="foot" style="margin-top:10px">Both are public protocols from ClinicalTrials.gov, used here to demonstrate. IBMT Clinical is not involved in either trial.</p>
 <div class="btn-row"><button class="btn btn-primary" id="run">Map this protocol to Nigeria</button>${state.loaded?`<button class="btn btn-ghost" id="reset">Reset demo</button>`:""}</div>
 <div id="reading"></div>
 <h2>Built from Nigerian official sources</h2>
 <div class="auths">
  <div class="auth"><b>NAFDAC</b><span>Clinical trial authorisation</span></div>
  <div class="auth"><b>NHREC</b><span>National ethics review</span></div>
  <div class="auth"><b>Institutional review boards</b><span>Site-level ethics approval</span></div>
 </div>`;}
function reading(){
 const steps=["Reading the protocol ("+P().pages+")","Finding sites, population, and product",
  "Checking whether dosing needs adaptation for Nigeria",
  "Matching to NAFDAC and ethics requirements","Checking the 17-document NAFDAC package"];
 const box=document.getElementById("reading");
 box.innerHTML=`<div class="reading">${steps.map((x,i)=>`<div class="rline" id="r${i}"><span class="tick"></span>${x}</div>`).join("")}</div>`;
 const d=matchMedia("(prefers-reduced-motion: reduce)").matches?0:550;
 steps.forEach((x,i)=>setTimeout(()=>{const el=document.getElementById("r"+i); if(el){el.classList.add("done"); el.querySelector(".tick").textContent="✓";}},d*(i+1)));
 setTimeout(()=>{state.loaded=true;state.confirmed=false;go("facts");},d*(steps.length+1));
}
function facts(){
 const p = P(), d = p.dose();
 const dl = d.lines.map(x=>`<li>${x.b?`<b>${x.t}</b>`:x.t}${x.src?" "+s(x.src[0],x.src[1]):""}</li>`).join("");
 return `
 <div class="eyebrow">Step 1 of 3 · Protocol</div>
 <h1>What the protocol says, and what it's missing</h1>
 <p class="lead">Every fact links to its source in the protocol. Anything not stated is flagged, not guessed. ${p.pages}.</p>
 <div class="card">${p.facts.map(f=>`<div class="fact"><div class="k">${f.k}</div><div class="meta">${pg(f.p)}<span class="conf ${f.c==="high"?"high":f.c==="medium"?"med":"low"}">${f.c==="high"?"stated":f.c==="low"?"unclear":"partial"}</span></div><div class="v">${f.v}</div></div>`).join("")}</div>
 <h2>${p.gaps.length} gaps to close before filing</h2>
 <div class="card">${p.gaps.map((g,i)=>`<div class="gap"><i>${i+1}</i><div>${g}</div></div>`).join("")}</div>
 <h2>Dose adaptation check</h2>
 <p class="lead">Does this protocol's dosing need changing for a Nigerian population? Checked against the
   pharmacogenomic evidence for each study drug.</p>
 <div class="card dosecheck ${d.indicated?"yes":"no"}">
  <div class="dc-head"><span class="dc-mark">${d.indicated?"!":"✓"}</span>
   <div><h3>${d.head}</h3><div class="dc-sub">${d.sub}</div></div></div>
  <ul class="dc-list">${dl}</ul>
 </div>
 <div class="btn-row"><button class="btn btn-primary" id="confirm">${state.confirmed?"Facts confirmed · view checklist":"Confirm facts and build checklist"}</button></div>`;}
function checklist(){
 const groups=[...new Set(REQS.map(r=>r.g))]; let n=0;
 const sb={src:`<span class="badge b-src">From official source</span>`,likely:`<span class="badge b-likely">Likely · confirm</span>`,unv:`<span class="badge b-unv">Unverified</span>`};
 return `
 <div class="eyebrow">Step 2 of 3 · Nigeria checklist</div>
 <h1>10 requirements, in the order they happen</h1>
 <p class="lead">Each requirement shows why it applies to this protocol and the official source it comes from. Blue tags open the source.</p>
 <div class="banner info"><b>Key sequence:</b> NAFDAC's package must include each site's ethics approval and meeting minutes ${s("S1","§2.5.8–10")}, so ethics approval is on the critical path before NAFDAC.</div>
 ${groups.map(g=>`<div class="group">${g}</div><div class="stack">${REQS.filter(r=>r.g===g).map(r=>{n++;return `
  <div class="card req"><div class="step">${n}</div><div style="min-width:0">
   <h3>${r.name}</h3>
   <p class="why">${r.why} ${pg(r.p)}</p>
   <dl class="kv">${r.kv.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>
   <div class="tags">${sb[r.st]}${r.src.map(([i,sec])=>s(i,sec)).join("")}<span class="badge b-unv">Expert check pending</span></div>
  </div></div>`}).join("")}</div>`).join("")}
 <div class="group">Not required for this study</div>
 <div class="stack">${NOT_REQ.map(x=>`<div class="na"><b style="color:var(--fg)">${x.name}</b><br>${x.why}</div>`).join("")}</div>
 <div class="btn-row"><button class="btn btn-primary" data-go="package">Check the NAFDAC package</button></div>`;}
function pkg(){
 const c={ready:0,fix:0,need:0,gap:0,wait:0}; PKG.forEach(x=>c[x[3]]++);
 const DR=P().drafts(); if(!DR[state.draft]) state.draft=P().firstDraft;
 const d=DR[state.draft];
 const body=d.paras.map(par=>`<p>${par.map(x=>x.ph?`<span class="ph">${x.t}</span>`:`${x.b?`<b>${x.t}</b>`:x.t}${x.p&&x.p.length?pg(x.p):""}${x.src?s(x.src[0],x.src[1]):""}`).join(par.length>2||(par[0].t||"").startsWith("The Director")||(par[0].t||"").startsWith("Yours")?"<br>":" ")}</p>`).join("");
 return `
 <div class="eyebrow">Step 3 of 3 · Package and drafts</div>
 <h1>NAFDAC package: 17 documents, ${c.gap+c.fix} gaps, ${c.need} to request</h1>
 <p class="lead">Checked against the 17 documents NAFDAC's guideline lists ${s("S1","§2.5")}, confirmed current by IBMT Clinical's regulatory lead. Incomplete packages are a common cause of delay; this shows exactly who owes what.</p>
 <div class="stats">
  <div class="stat"><div class="n" style="color:var(--crit)">${c.gap+c.fix}</div><div class="l">Gaps or fixes</div></div>
  <div class="stat"><div class="n">${c.need}</div><div class="l">To request</div></div>
  <div class="stat"><div class="n">${c.wait}</div><div class="l">After ethics</div></div>
 </div>
 <div class="card">${PKG.map((x,i)=>`<div class="pk"><span class="no">${String(i+1).padStart(2,"0")}</span><div style="min-width:0"><div class="t">${x[0]}</div><div class="d">${x[1]} · ${x[2]}</div></div><span class="pill ${PST[x[3]][0]}">${PST[x[3]][1]}</span></div>`).join("")}</div>
 <h2>Drafts</h2>
 <div class="chips" role="group" aria-label="Drafts">${Object.entries(DR).map(([k,v])=>`<button class="chip" data-draft="${k}" aria-pressed="${k===state.draft}">${v.label}</button>`).join("")}</div>
 <div class="review"><span class="dot"></span>AI draft · every sentence sourced${state.draft==="dose"?" · figures generated live from the IBMT model "+s("S16"):""} · sign-off by IBMT Clinical regulatory lead pending</div>
 <div class="doc"><div class="printhead"><b>${d.label}</b>
   <span>${P().name} · ${P().nct} · prepared by IBMT Clinical · draft, pending regulatory sign-off</span></div>${body}</div>
 <div class="btn-row"><button class="btn btn-primary" id="printDraft">Print this draft</button></div>`;}
/* ---------- Sheet ---------- */
function sheet(html){const sc=document.createElement("div");sc.className="scrim";sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}<div class="btn-row"><button class="btn btn-ghost" data-close>Close</button></div></div>`;sc.addEventListener("click",e=>{if(e.target===sc||e.target.closest("[data-close]"))sc.remove();});document.body.appendChild(sc);sc.querySelector("[data-close]").focus();}
function srcSheet(id){const x=SRC[id];sheet(`<div class="src"><div class="id">${id} · ${x.kind}</div><h3>${x.t}</h3><div class="meta">${x.ref}</div><a href="${x.url}" target="_blank" rel="noopener">Open document</a></div>`);}
function allSources(){sheet(`<h3>Sources reviewed</h3><div class="meta">Public documents only. Each is being verified with Nigerian regulatory experts, and confirmed against the current official version before use in a real filing.</div>${Object.entries(SRC).map(([id,x])=>`<div class="src"><div class="id">${id} · ${x.kind}</div><b>${x.t}</b><div class="meta" style="margin:4px 0">${x.ref}</div><a href="${x.url}" target="_blank" rel="noopener">Open document</a></div>`).join("")}`);}

/* ---------- Render ---------- */
function render(){
 const sc=state.screen;
 app.innerHTML=({home,facts,checklist,package:pkg})[sc]();
 document.querySelectorAll(".tab").forEach(t=>{const g=t.dataset.go; if(g===sc)t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); t.disabled=g!=="home"&&!state.loaded;});
 const sl=document.getElementById("studyLine");
 sl.innerHTML=P().line;
 sl.hidden=!state.loaded||sc==="home";
}
document.addEventListener("click",e=>{
 if(e.target.closest(".scrim")&&!e.target.closest("[data-src]"))return;
 const g=e.target.closest("[data-go]"); if(g){go(g.dataset.go);return;}
 const sr=e.target.closest("[data-src]"); if(sr){srcSheet(sr.dataset.src);return;}
 const p=e.target.closest(".ptag"); if(p){toast("ARETTA protocol, page "+p.dataset.pages.split(",").join(", ")+". Full version opens the page.");return;}
 const c=e.target.closest("[data-draft]"); if(c){state.draft=c.dataset.draft;save();render();return;}
 if(e.target.closest("#printDraft")){window.print();return;}
 if(e.target.closest("#openSources")){allSources();return;}
 const pr=e.target.closest("[data-proto]");
 if(pr){state.proto=pr.dataset.proto;state.draft=P().firstDraft;state.loaded=false;state.confirmed=false;
        save();render();toast(P().name+" selected");return;}
 if(e.target.closest("#run")){reading();return;}
 if(e.target.closest("#reset")){state={screen:"home",loaded:false,confirmed:false,draft:"cover",proto:"aretta"};save();render();toast("Demo reset");return;}
 if(e.target.closest("#confirm")){state.confirmed=true;save();go("checklist");return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const sc=document.querySelector(".scrim"); if(sc)sc.remove();}});
render();
</script>

</body>
</html>
